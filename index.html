    <script>
        // Apply theme immediately to prevent flash
        window.applyTheme = function (background, accent) {
            const ROOT = document.documentElement;
            const STYLE = ROOT.style;
            const THEME = background === "light" ? "light" : "dark";
            const ACCENT = ["lightning", "acid", "amber", "arcane"].includes(accent)
                ? accent
                : "lightning";

            localStorage.setItem('theme', THEME);
            localStorage.setItem('accent', ACCENT);

            ROOT.classList.add("notransition");
            ROOT.dataset.theme = THEME;
            ROOT.dataset.accent = ACCENT;
            STYLE.colorScheme = THEME;
            window.requestAnimationFrame(() => {
                ROOT.classList.remove("notransition");
            });
        };

        // Apply on initial load
        window.applyTheme(
            localStorage.getItem('theme') || 'dark',
            localStorage.getItem('accent') || 'lightning'
        );
    </script>
